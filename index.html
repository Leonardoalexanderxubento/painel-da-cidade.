<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da Cidade</title>
  <meta name="description" content="Clima, qualidade do ar, bicicletas compartilhadas, feriados e lugares próximos da sua cidade, atualizados automaticamente com dados públicos.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Painel da cidade</span>
      <h1 id="city-name">Carregando…</h1>
      <p id="city-meta" class="muted"></p>
    </div>

    <form id="search" class="search" role="search" autocomplete="off">
      <label for="search-input" class="sr-only">Buscar cidade</label>
      <input id="search-input" type="search" placeholder="Buscar outra cidade…" minlength="2">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </form>

    <div class="refresh">
      <button id="refresh-btn" type="button" title="Atualizar agora">↻ Atualizar</button>
      <span id="updated" class="muted">—</span>
    </div>
  </header>

  <main class="grid">
    <section class="card card-now" id="card-now" aria-labelledby="h-now">
      <h2 id="h-now">Agora</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>

    <section class="card card-air" id="card-air" aria-labelledby="h-air">
      <h2 id="h-air">Qualidade do ar</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>

    <section class="card card-hourly" id="card-hourly" aria-labelledby="h-hourly">
      <h2 id="h-hourly">Próximas 24 horas</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>

    <section class="card card-week" id="card-week" aria-labelledby="h-week">
      <h2 id="h-week">7 dias</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>

    <section class="card card-bikes" id="card-bikes" aria-labelledby="h-bikes">
      <h2 id="h-bikes">Bicicletas compartilhadas</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>

    <section class="card card-holidays" id="card-holidays" aria-labelledby="h-holidays">
      <h2 id="h-holidays">Próximos feriados</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>

    <section class="card card-places" id="card-places" aria-labelledby="h-places">
      <h2 id="h-places">Por perto</h2>
      <div class="body"><div class="skeleton"></div></div>
    </section>
  </main>

  <footer class="footer muted">
    Dados:
    <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (clima e ar, CAMS) ·
    <a href="https://citybik.es/" target="_blank" rel="noopener">CityBikes</a> ·
    <a href="https://date.nager.at/" target="_blank" rel="noopener">Nager.Date</a> ·
    <a href="https://pt.wikipedia.org/" target="_blank" rel="noopener">Wikipédia</a> ·
    Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
